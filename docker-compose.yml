services:
  sam-inference:
    build:
      context: ./src/ai/sam-inference
      dockerfile: Dockerfile
    image: maskflow-sam-inference:latest
    container_name: maskflow-sam-inference
    expose:
      - "8001"
    environment:
      SAM3_INTERNAL_KEY: ${SAM3_INTERNAL_KEY:?Set SAM3_INTERNAL_KEY in .env}
      SAM3_REQUIRE_INTERNAL_KEY: "true"
      SAM3_MODEL: /models/sam3.pt
      SAM3_MAX_INFERENCE_SIDE: "1024"
      SAM3_ENABLE_CLIP_CLASSIFICATION: "true"
      SAM3_INCLUDE_CATEGORY_OVERLAYS: "true"
      SAM3_CORS_ORIGINS: "*"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./资源/模型/sam3.pt:/models/sam3.pt:ro
    gpus: all
    shm_size: "8gb"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: maskflow-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: maskflow-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: maskflow
      MYSQL_USER: maskflow
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./src/backend/maskflow-api
      dockerfile: Dockerfile
    image: maskflow-api-dotnet:latest
    container_name: maskflow-api
    ports:
      - "8000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      SAM3_INTERNAL_KEY: ${SAM3_INTERNAL_KEY:?Set SAM3_INTERNAL_KEY in .env}
      MASKFLOW_ADMIN_API_KEY: ${MASKFLOW_ADMIN_API_KEY:?Set MASKFLOW_ADMIN_API_KEY in .env}
      MASKFLOW_CORS_ORIGINS: ${MASKFLOW_CORS_ORIGINS:-http://localhost:3000}
      SAM_SERVICE_URL: http://sam-inference:8001
      MASKFLOW_STORAGE: /data/storage
      MASKFLOW_MYSQL: Server=mysql;Port=3306;Database=maskflow;User ID=maskflow;Password=${MYSQL_PASSWORD};Allow User Variables=true;
      MASKFLOW_MINIO_ENDPOINT: http://minio:9000
      MASKFLOW_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MASKFLOW_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MASKFLOW_MINIO_BUCKET: maskflow
    volumes:
      - maskflow-api-data:/data
    depends_on:
      mysql:
        condition: service_healthy
      sam-inference:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ./src/frontend/maskflow-web
      dockerfile: Dockerfile
    image: maskflow-web-vue:latest
    container_name: maskflow-web
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  maskflow-api-data:
  minio-data:
  mysql-data: