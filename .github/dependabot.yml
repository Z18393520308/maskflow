version: 2
updates:
  - package-ecosystem: npm
    directory: /src/frontend/maskflow-web
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /src/backend/maskflow-api
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      backend-dependencies:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /src/ai/sam-inference
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      inference-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
